services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: tcg_jenkins
    restart: unless-stopped
    user: root
    ports:
      - "${JENKINS_PORT:-8088}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true -Dorg.apache.commons.jelly.tags.fmt.timeZone=Asia/Bangkok"
      TZ: Asia/Bangkok
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tcg_network

networks:
  tcg_network:
    name: tcg_network
    driver: bridge

volumes:
  jenkins_home:
    name: tcg_jenkins_home
