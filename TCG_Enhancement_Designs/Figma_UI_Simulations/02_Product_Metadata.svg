<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" style="background-color: #F8FAFC; font-family: sans-serif;">
        <!-- Header -->
        <rect width="100%" height="60" fill="#0F172A" />
        <text x="20" y="38" fill="white" font-size="24" font-weight="bold">Figma Simulation: Seller Inventory (Condition &amp; Grading)</text>
        
        <!-- Canvas -->
        <g transform="translate(40, 90)">
            
    <rect x="0" y="0" width="600" height="500" fill="white" rx="8" stroke="#E2E8F0" />
    <text x="30" y="40" font-size="22" font-weight="bold" fill="#1E293B">Add New Card to Inventory</text>
    
    <text x="30" y="80" font-size="14" fill="#64748B">Product Name</text>
    <rect x="30" y="90" width="540" height="40" fill="#F1F5F9" rx="4" stroke="#CBD5E1" />
    <text x="45" y="115" font-size="14" fill="#0F172A">Charizard VMAX (Secret Rare)</text>
    
    <g transform="translate(0, 160)">
        <rect x="20" y="-10" width="560" height="150" fill="#EFF6FF" rx="4" stroke="#93C5FD" stroke-dasharray="4" />
        <text x="30" y="15" font-size="16" font-weight="bold" fill="#1D4ED8">TCG Specific Data (New Feature)</text>
        
        <text x="30" y="50" font-size="14" fill="#64748B">Card Condition</text>
        <rect x="30" y="60" width="250" height="40" fill="white" rx="4" stroke="#CBD5E1" />
        <text x="45" y="85" font-size="14" fill="#0F172A">NM (Near Mint) ▼</text>
        
        <text x="320" y="50" font-size="14" fill="#64748B">Grading Company (Optional)</text>
        <rect x="320" y="60" width="120" height="40" fill="white" rx="4" stroke="#CBD5E1" />
        <text x="335" y="85" font-size="14" fill="#0F172A">PSA ▼</text>
        
        <text x="460" y="50" font-size="14" fill="#64748B">Grade Score</text>
        <rect x="460" y="60" width="110" height="40" fill="white" rx="4" stroke="#CBD5E1" />
        <text x="475" y="85" font-size="14" fill="#0F172A">10</text>
    </g>
    
    <text x="30" y="350" font-size="14" fill="#64748B">Price (THB)</text>
    <rect x="30" y="360" width="250" height="40" fill="#F1F5F9" rx="4" stroke="#CBD5E1" />

        </g>
    </svg>