<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" style="background-color: #F8FAFC; font-family: sans-serif;">
        <!-- Header -->
        <rect width="100%" height="60" fill="#0F172A" />
        <text x="20" y="38" fill="white" font-size="24" font-weight="bold">Figma Simulation: Checkout (Stock Timer &amp; Security Fee)</text>
        
        <!-- Canvas -->
        <g transform="translate(40, 90)">
            
    <rect x="0" y="0" width="500" height="450" fill="white" rx="8" stroke="#E2E8F0" />
    
    <!-- Timer -->
    <rect x="0" y="0" width="500" height="50" fill="#FEF2F2" rx="8" />
    <text x="250" y="30" font-size="16" font-weight="bold" fill="#DC2626" text-anchor="middle">⏳ Order Reserved! Time remaining: 09:45</text>
    
    <text x="30" y="90" font-size="22" font-weight="bold" fill="#1E293B">Order Summary</text>
    
    <rect x="30" y="110" width="440" height="230" fill="#F8FAFC" rx="4" stroke="#E2E8F0" />
    
    <text x="50" y="140" font-size="16" fill="#0F172A">Subtotal (1 item)</text>
    <text x="400" y="140" font-size="16" fill="#0F172A" text-anchor="end">฿15,000</text>
    
    <text x="50" y="170" font-size="16" fill="#0F172A">Leg 2 Shipping (Hub to You)</text>
    <text x="400" y="170" font-size="16" fill="#0F172A" text-anchor="end">฿50</text>
    
    <!-- Security Fee Highlight -->
    <rect x="40" y="190" width="420" height="40" fill="#ECFCCB" rx="4" />
    <text x="50" y="215" font-size="16" font-weight="bold" fill="#4D7C0F">Security &amp; QC Fee (Required)</text>
    <text x="400" y="215" font-size="16" font-weight="bold" fill="#4D7C0F" text-anchor="end">฿150</text>
    
    <line x1="50" y1="250" x2="450" y2="250" stroke="#CBD5E1" stroke-dasharray="4" />
    
    <text x="50" y="290" font-size="20" font-weight="bold" fill="#0F172A">Total Payment</text>
    <text x="450" y="290" font-size="24" font-weight="bold" fill="#2563EB" text-anchor="end">฿15,200</text>
    
    <rect x="30" y="370" width="440" height="50" fill="#0F172A" rx="4" />
    <text x="250" y="400" font-size="18" fill="white" font-weight="bold" text-anchor="middle">Confirm Checkout (PromptPay QR)</text>

        </g>
    </svg>