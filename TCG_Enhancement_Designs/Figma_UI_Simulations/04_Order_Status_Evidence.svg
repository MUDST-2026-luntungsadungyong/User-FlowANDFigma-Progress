<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" style="background-color: #F8FAFC; font-family: sans-serif;">
        <!-- Header -->
        <rect width="100%" height="60" fill="#0F172A" />
        <text x="20" y="38" fill="white" font-size="24" font-weight="bold">Figma Simulation: Logistics (QC Hub Status &amp; Evidence)</text>
        
        <!-- Canvas -->
        <g transform="translate(40, 90)">
            
    <rect x="0" y="0" width="600" height="500" fill="white" rx="8" stroke="#E2E8F0" />
    <text x="30" y="40" font-size="22" font-weight="bold" fill="#1E293B">Order Details: #ORD-999</text>
    
    <!-- Status Tracker -->
    <text x="30" y="80" font-size="16" font-weight="bold" fill="#64748B">Order Status (2-Leg Fulfillment)</text>
    <circle cx="50" cy="120" r="15" fill="#22C55E" /> <text x="50" y="125" font-size="14" fill="white" text-anchor="middle">✓</text>
    <line x1="65" y1="120" x2="165" y2="120" stroke="#22C55E" stroke-width="4" />
    
    <circle cx="180" cy="120" r="15" fill="#22C55E" /> <text x="180" y="125" font-size="14" fill="white" text-anchor="middle">✓</text>
    <line x1="195" y1="120" x2="295" y2="120" stroke="#22C55E" stroke-width="4" />
    
    <circle cx="310" cy="120" r="15" fill="#3B82F6" /> <text x="310" y="125" font-size="14" fill="white" text-anchor="middle">3</text>
    <line x1="325" y1="120" x2="425" y2="120" stroke="#E2E8F0" stroke-width="4" />
    
    <circle cx="440" cy="120" r="15" fill="#E2E8F0" /> <text x="440" y="125" font-size="14" fill="#64748B" text-anchor="middle">4</text>
    
    <text x="50" y="150" font-size="12" fill="#64748B" text-anchor="middle">Shipped</text>
    <text x="180" y="150" font-size="12" fill="#64748B" text-anchor="middle">Arrived at Hub</text>
    <text x="310" y="150" font-size="12" font-weight="bold" fill="#3B82F6" text-anchor="middle">QC Passed</text>
    <text x="440" y="150" font-size="12" fill="#64748B" text-anchor="middle">Delivering</text>
    
    <!-- QC Evidence Section -->
    <rect x="30" y="190" width="540" height="280" fill="#F8FAFC" rx="4" stroke="#CBD5E1" />
    <text x="50" y="225" font-size="18" font-weight="bold" fill="#0F172A">📸 QC Hub Evidence &amp; Inspection</text>
    <text x="50" y="250" font-size="14" fill="#64748B">Hub verified this item is Authentic and matches Condition: NM</text>
    
    <!-- Video Player Mock -->
    <rect x="50" y="270" width="200" height="120" fill="#334155" rx="4" />
    <circle cx="150" cy="330" r="25" fill="white" opacity="0.8" />
    <polygon points="142,315 165,330 142,345" fill="#334155" />
    <text x="150" y="415" font-size="14" fill="#0F172A" text-anchor="middle">Unboxing Video.mp4</text>
    
    <!-- Photo Mock -->
    <rect x="270" y="270" width="120" height="120" fill="#CBD5E1" rx="4" />
    <text x="330" y="335" font-size="30" fill="white" text-anchor="middle">📷</text>
    <text x="330" y="415" font-size="14" fill="#0F172A" text-anchor="middle">Front_Macro.jpg</text>
    
    <rect x="410" y="270" width="120" height="120" fill="#CBD5E1" rx="4" />
    <text x="470" y="335" font-size="30" fill="white" text-anchor="middle">📷</text>
    <text x="470" y="415" font-size="14" fill="#0F172A" text-anchor="middle">Back_Macro.jpg</text>

        </g>
    </svg>