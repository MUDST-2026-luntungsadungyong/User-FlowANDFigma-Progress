<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" style="background-color: #FFFFFF; font-family: sans-serif;">
        <!-- Header -->
        <rect width="100%" height="80" fill="#2C3E50" />
        <text x="30" y="50" fill="white" font-size="28" font-weight="bold">User Flow Simulation: 2-Leg Logistics &amp; QC Hub</text>
        
        <!-- Legend -->
        <g transform="translate(800, 25)">
            <rect x="0" y="0" width="20" height="20" fill="#B3E5FC" />
            <text x="30" y="15" font-size="14">Buyer</text>
            <rect x="90" y="0" width="20" height="20" fill="#FFCC80" />
            <text x="120" y="15" font-size="14">Seller</text>
            <rect x="180" y="0" width="20" height="20" fill="#C8E6C9" />
            <text x="210" y="15" font-size="14">System</text>
            <rect x="280" y="0" width="20" height="20" fill="#E1BEE7" />
            <text x="310" y="15" font-size="14">QC Hub</text>
        </g>

        <!-- Swimlane Backgrounds -->
        <g transform="translate(0, 80)">
            <rect x="0" y="0" width="1200" height="180" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1" />
            <text x="20" y="95" font-size="18" font-weight="bold" fill="#757575" transform="rotate(-90 20,95)">BUYER</text>
            
            <rect x="0" y="180" width="1200" height="180" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" />
            <text x="20" y="275" font-size="18" font-weight="bold" fill="#757575" transform="rotate(-90 20,275)">SYSTEM</text>

            <rect x="0" y="360" width="1200" height="180" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1" />
            <text x="20" y="455" font-size="18" font-weight="bold" fill="#757575" transform="rotate(-90 20,455)">SELLER</text>

            <rect x="0" y="540" width="1200" height="180" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" />
            <text x="20" y="635" font-size="18" font-weight="bold" fill="#757575" transform="rotate(-90 20,635)">QC HUB</text>
        </g>
        
        <!-- Nodes -->
        <g transform="translate(60, 80)">
            
    <rect x="50" y="400" width="160" height="60" fill="#FFCC80" rx="8" stroke="#333" stroke-width="2" />
    <text x="130.0" y="419.0" font-size="14" fill="#333" text-anchor="middle">พิมพ์ใบปะหน้า</text><text x="130.0" y="439.0" font-size="14" fill="#333" text-anchor="middle">ส่งของ</text>
    
    <line x1="210" y1="430" x2="280" y2="430" stroke="#333" stroke-width="2" />
    <polygon points="280,430 270,425 270,435" fill="#333" />
    
    <rect x="280" y="400" width="160" height="60" fill="#FFCC80" rx="8" stroke="#333" stroke-width="2" />
    <text x="360.0" y="427.0" font-size="14" fill="#333" text-anchor="middle">กรอก Tracking</text>
    
    <line x1="360" y1="460" x2="360" y2="580" stroke="#333" stroke-width="2" />
    <polygon points="360,580 350,575 350,585" fill="#333" />
    
    <rect x="280" y="580" width="160" height="60" fill="#E1BEE7" rx="8" stroke="#333" stroke-width="2" />
    <text x="360.0" y="599.0" font-size="14" fill="#333" text-anchor="middle">รับพัสดุเข้า Hub</text><text x="360.0" y="619.0" font-size="14" fill="#333" text-anchor="middle">ถ่าย Video แกะกล่อง</text>
    
    <line x1="440" y1="610" x2="520" y2="610" stroke="#333" stroke-width="2" />
    <polygon points="520,610 510,605 510,615" fill="#333" />
    
    <rect x="520" y="580" width="160" height="60" fill="#E1BEE7" rx="8" stroke="#333" stroke-width="2" />
    <text x="600.0" y="599.0" font-size="14" fill="#333" text-anchor="middle">ตรวจสอบการ์ด</text><text x="600.0" y="619.0" font-size="14" fill="#333" text-anchor="middle">(QC Pass/Fail)</text>
    
    <line x1="600" y1="580" x2="600" y2="270" stroke="#333" stroke-width="2" />
    <polygon points="600,270 590,265 590,275" fill="#333" />
    
    <rect x="520" y="210" width="160" height="60" fill="#C8E6C9" rx="8" stroke="#333" stroke-width="2" />
    <text x="600.0" y="229.0" font-size="14" fill="#333" text-anchor="middle">แจ้งเตือนผล QC</text><text x="600.0" y="249.0" font-size="14" fill="#333" text-anchor="middle">อัพเดตสถานะ</text>
    
    <line x1="600" y1="210" x2="600" y2="100" stroke="#333" stroke-width="2" />
    <polygon points="600,100 590,95 590,105" fill="#333" />
    
    <rect x="520" y="40" width="160" height="60" fill="#B3E5FC" rx="8" stroke="#333" stroke-width="2" />
    <text x="600.0" y="59.0" font-size="14" fill="#333" text-anchor="middle">ดูหลักฐาน Video</text><text x="600.0" y="79.0" font-size="14" fill="#333" text-anchor="middle">ในหน้า Order Detail</text>
    
    <line x1="680" y1="610" x2="750" y2="610" stroke="#333" stroke-width="2" />
    <polygon points="750,610 740,605 740,615" fill="#333" />
    
    <rect x="750" y="580" width="160" height="60" fill="#E1BEE7" rx="8" stroke="#333" stroke-width="2" />
    <text x="830.0" y="599.0" font-size="14" fill="#333" text-anchor="middle">ส่งต่อให้ Buyer</text><text x="830.0" y="619.0" font-size="14" fill="#333" text-anchor="middle">(Leg 2)</text>
    
        </g>
    </svg>