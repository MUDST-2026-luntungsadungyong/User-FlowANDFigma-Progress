<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 680" width="1640" height="680">
<defs>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap');
            text {
                font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
                font-size: 13px;
                fill: #1e293b;
                text-anchor: middle;
                dominant-baseline: central;
            }
            .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: start; }
            .legend-text { font-size: 13px; fill: #475569; text-anchor: start; }
            .lane-label { font-size: 15px; font-weight: 600; fill: #64748b; }
            .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
            
            .node-start-end { fill: #86efac; stroke: #22c55e; stroke-width: 1.5; }
            .node-customer { fill: #d8b4fe; stroke: #a855f7; stroke-width: 1.5; }
            .node-seller { fill: #fef08a; stroke: #eab308; stroke-width: 1.5; }
            .node-system { fill: #fed7aa; stroke: #f97316; stroke-width: 1.5; }
            .node-error { fill: #fca5a5; stroke: #ef4444; stroke-width: 1.5; }
            .node-decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
            
            .lane-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
            .flow-line { stroke: #64748b; stroke-width: 1.8; fill: none; }
        </style>
    

        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
        <marker id="circle-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
            <circle cx="5" cy="5" r="4" fill="#64748b" />
        </marker>
    
</defs>
<rect width="1640" height="680" fill="#ffffff" />
<text x="40" y="45" class="title">US-04: Place Order System (Checkout &amp; Stock Reservation)</text>
<circle cx="40" cy="85" r="9" fill="#d8b4fe" />
<text x="58" y="85" class="legend-text">Customer actions</text>
<circle cx="200" cy="85" r="9" fill="#1e293b" />
<text x="218" y="85" class="legend-text">Decisions</text>
<circle cx="310" cy="85" r="9" fill="#fed7aa" />
<text x="328" y="85" class="legend-text">System actions</text>
<circle cx="450" cy="85" r="9" fill="#fca5a5" />
<text x="468" y="85" class="legend-text">Error</text>
<text x="45" y="260" class="lane-label" transform="rotate(-90 45 260)">Customer</text>
<line x1="80" y1="390" x2="1600" y2="390" class="lane-line" />
<text x="45" y="520" class="lane-label" transform="rotate(-90 45 520)">System</text>
<polyline points="170,240 210,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="350,240 390,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="530,240 570,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="720,240 760,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="830,270 830,520 940,520" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1020,480 1020,410" class="flow-line" marker-end="url(#arrow)" />
<rect x="1021" y="435" width="28" height="20" fill="#ffffff" rx="4" />
<text x="1035" y="445" class="edge-label">No</text>
<polyline points="940,385 645,385 645,270" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1100,520 1140,520" class="flow-line" marker-end="url(#arrow)" />
<rect x="1102" y="495" width="36" height="20" fill="#ffffff" rx="4" />
<text x="1120" y="505" class="edge-label">Yes</text>
<polyline points="1290,520 1330,520" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1405,490 1405,270" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1480,240 1520,240" class="flow-line" marker-end="url(#arrow)" />
<rect x="100" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="135" y="240">start</text>
<rect x="210" y="210" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="280" y="232">ลูกค้าเปิดหน้า</text>
<text x="280" y="248">Shopping Cart</text>
<rect x="390" y="210" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="460" y="232">กดปุ่ม</text>
<text x="460" y="248">&quot;Checkout&quot;</text>
<rect x="570" y="210" width="150" height="60" rx="8" ry="8" class="node-customer" />
<text x="645" y="232">ตรวจสอบสรุปรายการ</text>
<text x="645" y="248">และข้อมูลผู้ขาย</text>
<rect x="760" y="210" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="830" y="232">กดปุ่ม</text>
<text x="830" y="248">&quot;Confirm Order&quot;</text>
<polygon points="1020,480 1100,520 1020,560 940,520" class="node-decision" />
<text x="1020" y="512">มีสต๊อกว่างพอ?</text>
<text x="1020" y="528">(OnHand-Reserved)</text>
<rect x="940" y="360" width="160" height="50" rx="8" ry="8" class="node-error" />
<text x="1020" y="385">แจ้งเตือนสต๊อกไม่พอ</text>
<rect x="1140" y="490" width="150" height="60" rx="8" ry="8" class="node-system" />
<text x="1215" y="512">จองสต๊อกสินค้า</text>
<text x="1215" y="528">(เพิ่ม Reserved)</text>
<rect x="1330" y="490" width="150" height="60" rx="8" ry="8" class="node-system" />
<text x="1405" y="512">สร้าง Order</text>
<text x="1405" y="528">สถานะ &quot;Pending&quot;</text>
<rect x="1330" y="210" width="150" height="60" rx="8" ry="8" class="node-customer" />
<text x="1405" y="232">แสดงหน้าสำเร็จพร้อม</text>
<text x="1405" y="248">ช่องทางติดต่อ Seller</text>
<rect x="1520" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="1555" y="240">End</text>
</svg>