<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 600" width="1150" height="600">
<defs>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap');
            text {
                font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
                font-size: 13px;
                fill: #1e293b;
                text-anchor: middle;
                dominant-baseline: central;
            }
            .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: start; }
            .legend-text { font-size: 13px; fill: #475569; text-anchor: start; }
            .lane-label { font-size: 15px; font-weight: 600; fill: #64748b; }
            .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
            
            .node-start-end { fill: #86efac; stroke: #22c55e; stroke-width: 1.5; }
            .node-customer { fill: #d8b4fe; stroke: #a855f7; stroke-width: 1.5; }
            .node-seller { fill: #fef08a; stroke: #eab308; stroke-width: 1.5; }
            .node-system { fill: #fed7aa; stroke: #f97316; stroke-width: 1.5; }
            .node-error { fill: #fca5a5; stroke: #ef4444; stroke-width: 1.5; }
            .node-decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
            
            .lane-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
            .flow-line { stroke: #64748b; stroke-width: 1.8; fill: none; }
        </style>
    

        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
        <marker id="circle-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
            <circle cx="5" cy="5" r="4" fill="#64748b" />
        </marker>
    
</defs>
<rect width="1150" height="600" fill="#ffffff" />
<text x="40" y="45" class="title">US-06: Seller Dashboard (Estimated Cost &amp; Profit Calculator)</text>
<circle cx="40" cy="85" r="9" fill="#fef08a" />
<text x="58" y="85" class="legend-text">Seller actions</text>
<circle cx="180" cy="85" r="9" fill="#1e293b" />
<text x="198" y="85" class="legend-text">Decisions</text>
<circle cx="290" cy="85" r="9" fill="#fed7aa" />
<text x="308" y="85" class="legend-text">System actions</text>
<circle cx="430" cy="85" r="9" fill="#fca5a5" />
<text x="448" y="85" class="legend-text">Error</text>
<text x="45" y="245" class="lane-label" transform="rotate(-90 45 245)">Seller</text>
<line x1="80" y1="360" x2="1110" y2="360" class="lane-line" />
<text x="45" y="470" class="lane-label" transform="rotate(-90 45 470)">System</text>
<polyline points="170,240 210,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="360,240 400,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="560,240 600,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="670,270 670,440" class="flow-line" marker-end="url(#arrow)" />
<polyline points="750,470 800,470" class="flow-line" marker-end="url(#arrow)" />
<polyline points="885,440 885,270" class="flow-line" marker-end="url(#arrow)" />
<polyline points="970,240 1020,240" class="flow-line" marker-end="url(#arrow)" />
<rect x="100" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="135" y="240">start</text>
<rect x="210" y="210" width="150" height="60" rx="8" ry="8" class="node-seller" />
<text x="285" y="232">เปิดหน้า</text>
<text x="285" y="248">Seller Dashboard</text>
<rect x="400" y="210" width="160" height="60" rx="8" ry="8" class="node-seller" />
<text x="480" y="232">ระบุ/แก้ไข &quot;ต้นทุนการ์ด&quot;</text>
<text x="480" y="248">(Cost per Card)</text>
<rect x="600" y="210" width="140" height="60" rx="8" ry="8" class="node-seller" />
<text x="670" y="240">กดปุ่ม &quot;บันทึกต้นทุน&quot;</text>
<rect x="600" y="440" width="150" height="60" rx="8" ry="8" class="node-system" />
<text x="675" y="462">บันทึก Cost ลงฐานข้อมูล</text>
<text x="675" y="478">เฉพาะของ Seller</text>
<rect x="800" y="440" width="170" height="60" rx="8" ry="8" class="node-system" />
<text x="885" y="462">คำนวณกำไรประมาณการ</text>
<text x="885" y="478">(Price - Cost) x Qty</text>
<rect x="800" y="210" width="170" height="60" rx="8" ry="8" class="node-seller" />
<text x="885" y="232">ดูตัวเลขสรุปยอดขาย</text>
<text x="885" y="248">และ Estimated Profit</text>
<rect x="1020" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="1055" y="240">End</text>
</svg>