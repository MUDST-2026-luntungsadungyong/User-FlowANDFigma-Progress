<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580">
<defs>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap');
            text {
                font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
                font-size: 13px;
                fill: #1e293b;
                text-anchor: middle;
                dominant-baseline: central;
            }
            .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: start; }
            .legend-text { font-size: 13px; fill: #475569; text-anchor: start; }
            .lane-label { font-size: 15px; font-weight: 600; fill: #64748b; }
            .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
            
            .node-start-end { fill: #86efac; stroke: #22c55e; stroke-width: 1.5; }
            .node-customer { fill: #d8b4fe; stroke: #a855f7; stroke-width: 1.5; }
            .node-seller { fill: #fef08a; stroke: #eab308; stroke-width: 1.5; }
            .node-system { fill: #fed7aa; stroke: #f97316; stroke-width: 1.5; }
            .node-error { fill: #fca5a5; stroke: #ef4444; stroke-width: 1.5; }
            .node-decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
            
            .lane-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
            .flow-line { stroke: #64748b; stroke-width: 1.8; fill: none; }
        </style>
    

        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
    
</defs>
<rect width="900" height="580" fill="#ffffff" />
<text x="40" y="45" class="title">US-10-5: Stock Reservation Logic</text>
<circle cx="40" cy="85" r="9" fill="#d8b4fe" />
<text x="58" y="85" class="legend-text">Customer actions</text>
<circle cx="200" cy="85" r="9" fill="#fef08a" />
<text x="218" y="85" class="legend-text">Seller actions</text>
<circle cx="350" cy="85" r="9" fill="#1e293b" />
<text x="368" y="85" class="legend-text">Decisions</text>
<circle cx="460" cy="85" r="9" fill="#fed7aa" />
<text x="478" y="85" class="legend-text">System actions</text>
<circle cx="600" cy="85" r="9" fill="#fca5a5" />
<text x="618" y="85" class="legend-text">Error</text>
<text x="45" y="245" class="lane-label" transform="rotate(-90 45 245)">Customer (Trigger)</text>
<line x1="80" y1="360" x2="860" y2="360" class="lane-line" />
<text x="45" y="460" class="lane-label" transform="rotate(-90 45 460)">System</text>
<polyline points="135,260 135,460 210,460" class="flow-line" marker-end="url(#arrow)" />
<polyline points="360,460 390,460" class="flow-line" marker-end="url(#arrow)" />
<polyline points="460,420 460,360" class="flow-line" marker-end="url(#arrow)" />
<rect x="461" y="380" width="28" height="20" fill="#ffffff" rx="4" />
<text x="475" y="390" class="edge-label">No</text>
<polyline points="530,460 570,460" class="flow-line" marker-end="url(#arrow)" />
<rect x="532" y="435" width="36" height="20" fill="#ffffff" rx="4" />
<text x="550" y="445" class="edge-label">Yes</text>
<polyline points="720,460 760,460" class="flow-line" marker-end="url(#arrow)" />
<rect x="100" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="135" y="240">start</text>
<rect x="210" y="430" width="150" height="60" rx="8" ry="8" class="node-system" />
<text x="285" y="460">รับ Request จองสต๊อก</text>
<polygon points="460,420 530,460 460,500 390,460" class="node-decision" />
<text x="460" y="460">Available &gt;= Request?</text>
<rect x="390" y="310" width="140" height="50" rx="8" ry="8" class="node-error" />
<text x="460" y="335">Error: จองไม่ได้</text>
<rect x="570" y="430" width="150" height="60" rx="8" ry="8" class="node-system" />
<text x="645" y="452">เปลี่ยน Stock เป็น</text>
<text x="645" y="468">&quot;Reserved/Pending&quot;</text>
<rect x="760" y="440" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="795" y="460">End</text>
</svg>