<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580">
<defs>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap');
            text {
                font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
                font-size: 13px;
                fill: #1e293b;
                text-anchor: middle;
                dominant-baseline: central;
            }
            .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: start; }
            .legend-text { font-size: 13px; fill: #475569; text-anchor: start; }
            .lane-label { font-size: 15px; font-weight: 600; fill: #64748b; }
            .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
            
            .node-start-end { fill: #86efac; stroke: #22c55e; stroke-width: 1.5; }
            .node-customer { fill: #d8b4fe; stroke: #a855f7; stroke-width: 1.5; }
            .node-seller { fill: #fef08a; stroke: #eab308; stroke-width: 1.5; }
            .node-system { fill: #fed7aa; stroke: #f97316; stroke-width: 1.5; }
            .node-error { fill: #fca5a5; stroke: #ef4444; stroke-width: 1.5; }
            .node-decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
            
            .lane-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
            .flow-line { stroke: #64748b; stroke-width: 1.8; fill: none; }
        </style>
    

        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
        <marker id="circle-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
            <circle cx="5" cy="5" r="4" fill="#64748b" />
        </marker>
    
</defs>
<rect width="1280" height="580" fill="#ffffff" />
<text x="40" y="45" class="title">US-08: User Profile System (Contact Information Management)</text>
<circle cx="40" cy="85" r="9" fill="#d8b4fe" />
<text x="58" y="85" class="legend-text">Customer actions</text>
<circle cx="200" cy="85" r="9" fill="#1e293b" />
<text x="218" y="85" class="legend-text">Decisions</text>
<circle cx="310" cy="85" r="9" fill="#fed7aa" />
<text x="328" y="85" class="legend-text">System actions</text>
<circle cx="450" cy="85" r="9" fill="#fca5a5" />
<text x="468" y="85" class="legend-text">Error</text>
<text x="45" y="245" class="lane-label" transform="rotate(-90 45 245)">Customer</text>
<line x1="80" y1="360" x2="1240" y2="360" class="lane-line" />
<text x="45" y="460" class="lane-label" transform="rotate(-90 45 460)">System</text>
<polyline points="170,240 210,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="360,240 400,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="560,240 600,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="740,240 850,240 850,420" class="flow-line" marker-end="url(#arrow)" />
<polyline points="850,420 850,360" class="flow-line" marker-end="url(#arrow)" />
<rect x="851" y="380" width="28" height="20" fill="#ffffff" rx="4" />
<text x="865" y="390" class="edge-label">No</text>
<polyline points="780,335 480,335 480,270" class="flow-line" marker-end="url(#arrow)" />
<polyline points="920,460 970,460" class="flow-line" marker-end="url(#arrow)" />
<rect x="927" y="435" width="36" height="20" fill="#ffffff" rx="4" />
<text x="945" y="445" class="edge-label">Yes</text>
<polyline points="1045,430 1045,270" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1120,240 1160,240" class="flow-line" marker-end="url(#arrow)" />
<rect x="100" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="135" y="240">start</text>
<rect x="210" y="210" width="150" height="60" rx="8" ry="8" class="node-customer" />
<text x="285" y="232">ผู้ใช้เข้าสู่หน้า</text>
<text x="285" y="248">&quot;Profile Settings&quot;</text>
<rect x="400" y="210" width="160" height="60" rx="8" ry="8" class="node-customer" />
<text x="480" y="232">กรอก/แก้ไข &quot;ข้อมูลติดต่อ&quot;</text>
<text x="480" y="248">(Phone, Line, FB)</text>
<rect x="600" y="210" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="670" y="240">กดปุ่ม &quot;Save&quot;</text>
<polygon points="850,420 920,460 850,500 780,460" class="node-decision" />
<text x="850" y="460">ข้อมูลถูกต้อง?</text>
<rect x="780" y="310" width="140" height="50" rx="8" ry="8" class="node-error" />
<text x="850" y="335">แจ้งเตือนรูปแบบผิด</text>
<rect x="970" y="430" width="150" height="60" rx="8" ry="8" class="node-system" />
<text x="1045" y="452">บันทึก Contact Info</text>
<text x="1045" y="468">ลงในฐานข้อมูล</text>
<rect x="970" y="210" width="150" height="60" rx="8" ry="8" class="node-customer" />
<text x="1045" y="232">แสดงข้อความ</text>
<text x="1045" y="248">&quot;บันทึกข้อมูลสำเร็จ&quot;</text>
<rect x="1160" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="1195" y="240">End</text>
</svg>