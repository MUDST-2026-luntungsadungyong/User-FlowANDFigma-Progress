<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580">
<defs>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap');
            text {
                font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
                font-size: 13px;
                fill: #1e293b;
                text-anchor: middle;
                dominant-baseline: central;
            }
            .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: start; }
            .legend-text { font-size: 13px; fill: #475569; text-anchor: start; }
            .lane-label { font-size: 15px; font-weight: 600; fill: #64748b; }
            .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
            
            .node-start-end { fill: #86efac; stroke: #22c55e; stroke-width: 1.5; }
            .node-customer { fill: #d8b4fe; stroke: #a855f7; stroke-width: 1.5; }
            .node-seller { fill: #fef08a; stroke: #eab308; stroke-width: 1.5; }
            .node-system { fill: #fed7aa; stroke: #f97316; stroke-width: 1.5; }
            .node-error { fill: #fca5a5; stroke: #ef4444; stroke-width: 1.5; }
            .node-decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
            
            .lane-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
            .flow-line { stroke: #64748b; stroke-width: 1.8; fill: none; }
        </style>
    

        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
        <marker id="circle-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
            <circle cx="5" cy="5" r="4" fill="#64748b" />
        </marker>
    
</defs>
<rect width="1080" height="580" fill="#ffffff" />
<text x="40" y="45" class="title">US-NEW-3: Stock Reservation Semantics (Real-time Cart Clamp)</text>
<circle cx="40" cy="85" r="9" fill="#d8b4fe" />
<text x="58" y="85" class="legend-text">Customer actions</text>
<circle cx="200" cy="85" r="9" fill="#1e293b" />
<text x="218" y="85" class="legend-text">Decisions</text>
<circle cx="310" cy="85" r="9" fill="#fed7aa" />
<text x="328" y="85" class="legend-text">System actions</text>
<circle cx="450" cy="85" r="9" fill="#fca5a5" />
<text x="468" y="85" class="legend-text">Error</text>
<text x="45" y="245" class="lane-label" transform="rotate(-90 45 245)">Customer</text>
<line x1="80" y1="360" x2="1040" y2="360" class="lane-line" />
<text x="45" y="460" class="lane-label" transform="rotate(-90 45 460)">System</text>
<polyline points="170,240 210,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="350,240 390,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="530,240 655,240 655,420" class="flow-line" marker-end="url(#arrow)" />
<polyline points="655,420 655,360" class="flow-line" marker-end="url(#arrow)" />
<rect x="656" y="380" width="28" height="20" fill="#ffffff" rx="4" />
<text x="670" y="390" class="edge-label">No</text>
<polyline points="570,335 460,335 460,270" class="flow-line" marker-end="url(#arrow)" />
<polyline points="740,460 780,460" class="flow-line" marker-end="url(#arrow)" />
<rect x="742" y="435" width="36" height="20" fill="#ffffff" rx="4" />
<text x="760" y="445" class="edge-label">Yes</text>
<polyline points="855,430 855,270" class="flow-line" marker-end="url(#arrow)" />
<polyline points="930,240 970,240" class="flow-line" marker-end="url(#arrow)" />
<rect x="100" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="135" y="240">start</text>
<rect x="210" y="210" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="280" y="232">ลูกค้าเปิดหน้า</text>
<text x="280" y="248">Shopping Cart</text>
<rect x="390" y="210" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="460" y="232">กดปุ่มบวกจำนวน (+)</text>
<text x="460" y="248">เพิ่มการ์ดในตะกร้า</text>
<polygon points="655,420 740,460 655,500 570,460" class="node-decision" />
<text x="655" y="452">จำนวน &lt;= สต๊อกว่าง?</text>
<text x="655" y="468">(OnHand - Reserved)</text>
<rect x="570" y="310" width="170" height="50" rx="8" ry="8" class="node-error" />
<text x="655" y="335">แจ้งเตือนสต๊อกไม่พอจอง</text>
<rect x="780" y="430" width="150" height="60" rx="8" ry="8" class="node-system" />
<text x="855" y="452">อัปเดตจำนวนการ์ด</text>
<text x="855" y="468">ในตะกร้าสินค้า</text>
<rect x="780" y="210" width="150" height="60" rx="8" ry="8" class="node-customer" />
<text x="855" y="232">แสดงยอดรวมและ</text>
<text x="855" y="248">จำนวนสินค้าอัปเดต</text>
<rect x="970" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="1005" y="240">End</text>
</svg>