<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 600" width="1450" height="600">
<defs>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap');
            text {
                font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
                font-size: 13px;
                fill: #1e293b;
                text-anchor: middle;
                dominant-baseline: central;
            }
            .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: start; }
            .legend-text { font-size: 13px; fill: #475569; text-anchor: start; }
            .lane-label { font-size: 15px; font-weight: 600; fill: #64748b; }
            .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
            
            .node-start-end { fill: #86efac; stroke: #22c55e; stroke-width: 1.5; }
            .node-customer { fill: #d8b4fe; stroke: #a855f7; stroke-width: 1.5; }
            .node-seller { fill: #fef08a; stroke: #eab308; stroke-width: 1.5; }
            .node-system { fill: #fed7aa; stroke: #f97316; stroke-width: 1.5; }
            .node-error { fill: #fca5a5; stroke: #ef4444; stroke-width: 1.5; }
            .node-decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
            
            .lane-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
            .flow-line { stroke: #64748b; stroke-width: 1.8; fill: none; }
        </style>
    

        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
    
</defs>
<rect width="1450" height="600" fill="#ffffff" />
<text x="40" y="45" class="title">US-05-2: Delete Product (Seller)</text>
<circle cx="40" cy="85" r="9" fill="#fef08a" />
<text x="58" y="85" class="legend-text">Seller actions</text>
<circle cx="190" cy="85" r="9" fill="#1e293b" />
<text x="208" y="85" class="legend-text">Decisions</text>
<circle cx="300" cy="85" r="9" fill="#fed7aa" />
<text x="318" y="85" class="legend-text">System actions</text>
<circle cx="440" cy="85" r="9" fill="#fca5a5" />
<text x="458" y="85" class="legend-text">Error</text>
<text x="45" y="255" class="lane-label" transform="rotate(-90 45 255)">Seller</text>
<line x1="80" y1="380" x2="1410" y2="380" class="lane-line" />
<text x="45" y="480" class="lane-label" transform="rotate(-90 45 480)">System</text>
<polyline points="170,240 210,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="350,240 390,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="530,240 570,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="640,280 640,360 460,360 460,270" class="flow-line" marker-end="url(#arrow)" />
<rect x="641" y="290" width="28" height="20" fill="#ffffff" rx="4" />
<text x="655" y="300" class="edge-label">No</text>
<polyline points="710,240 825,240 825,420" class="flow-line" marker-end="url(#arrow)" />
<rect x="712" y="215" width="36" height="20" fill="#ffffff" rx="4" />
<text x="730" y="225" class="edge-label">Yes</text>
<polyline points="825,420 825,360" class="flow-line" marker-end="url(#arrow)" />
<rect x="822" y="380" width="36" height="20" fill="#ffffff" rx="4" />
<text x="840" y="390" class="edge-label">Yes</text>
<polyline points="750,335 690,335 690,240" class="flow-line" marker-end="url(#arrow)" />
<rect x="-6" y="-10" width="12" height="20" fill="#ffffff" rx="4" />
<text x="0" y="0" class="edge-label"></text>
<polyline points="900,460 940,460" class="flow-line" marker-end="url(#arrow)" />
<rect x="906" y="435" width="28" height="20" fill="#ffffff" rx="4" />
<text x="920" y="445" class="edge-label">No</text>
<polyline points="1090,460 1205,460 1205,270" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1280,240 1320,240" class="flow-line" marker-end="url(#arrow)" />
<rect x="100" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="135" y="240">start</text>
<rect x="210" y="210" width="140" height="60" rx="8" ry="8" class="node-seller" />
<text x="280" y="232">เข้าหน้า</text>
<text x="280" y="248">&quot;Product List&quot;</text>
<rect x="390" y="210" width="140" height="60" rx="8" ry="8" class="node-seller" />
<text x="460" y="232">กด &quot;Delete&quot;</text>
<text x="460" y="248">ที่สินค้ารายการหนึ่ง</text>
<polygon points="640,200 710,240 640,280 570,240" class="node-decision" />
<text x="640" y="240">ยืนยันการลบ?</text>
<polygon points="825,420 900,460 825,500 750,460" class="node-decision" />
<text x="825" y="452">สินค้าอยู่ใน Order</text>
<text x="825" y="468">ที่ยังไม่จบ (Pending)?</text>
<rect x="750" y="310" width="150" height="50" rx="8" ry="8" class="node-error" />
<text x="825" y="335">Error: ไม่สามารถลบได้</text>
<rect x="940" y="430" width="150" height="60" rx="8" ry="8" class="node-system" />
<text x="1015" y="452">ลบ/Archive</text>
<text x="1015" y="468">Record ใน DB</text>
<rect x="1130" y="210" width="150" height="60" rx="8" ry="8" class="node-seller" />
<text x="1205" y="232">แสดงหน้า Product List</text>
<text x="1205" y="248">ที่อัปเดตแล้ว</text>
<rect x="1320" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="1355" y="240">End</text>
</svg>