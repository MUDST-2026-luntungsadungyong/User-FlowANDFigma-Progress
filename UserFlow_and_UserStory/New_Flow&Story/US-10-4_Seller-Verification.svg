<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 580" width="1050" height="580">
<defs>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap');
            text {
                font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
                font-size: 13px;
                fill: #1e293b;
                text-anchor: middle;
                dominant-baseline: central;
            }
            .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: start; }
            .legend-text { font-size: 13px; fill: #475569; text-anchor: start; }
            .lane-label { font-size: 15px; font-weight: 600; fill: #64748b; }
            .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
            
            .node-start-end { fill: #86efac; stroke: #22c55e; stroke-width: 1.5; }
            .node-customer { fill: #d8b4fe; stroke: #a855f7; stroke-width: 1.5; }
            .node-seller { fill: #fef08a; stroke: #eab308; stroke-width: 1.5; }
            .node-system { fill: #fed7aa; stroke: #f97316; stroke-width: 1.5; }
            .node-error { fill: #fca5a5; stroke: #ef4444; stroke-width: 1.5; }
            .node-decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
            
            .lane-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
            .flow-line { stroke: #64748b; stroke-width: 1.8; fill: none; }
        </style>
    

        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
    
</defs>
<rect width="1050" height="580" fill="#ffffff" />
<text x="40" y="45" class="title">US-10-4: Self-serve Seller Verification</text>
<circle cx="40" cy="85" r="9" fill="#d8b4fe" />
<text x="58" y="85" class="legend-text">Customer actions</text>
<circle cx="200" cy="85" r="9" fill="#1e293b" />
<text x="218" y="85" class="legend-text">Decisions</text>
<circle cx="310" cy="85" r="9" fill="#fed7aa" />
<text x="328" y="85" class="legend-text">System actions</text>
<circle cx="450" cy="85" r="9" fill="#fca5a5" />
<text x="468" y="85" class="legend-text">Error</text>
<text x="45" y="245" class="lane-label" transform="rotate(-90 45 245)">Customer</text>
<line x1="80" y1="360" x2="1010" y2="360" class="lane-line" />
<text x="45" y="460" class="lane-label" transform="rotate(-90 45 460)">System</text>
<polyline points="170,240 210,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="350,240 390,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="460,270 460,460 570,460" class="flow-line" marker-end="url(#arrow)" />
<polyline points="720,460 750,460" class="flow-line" marker-end="url(#arrow)" />
<polyline points="900,460 940,460" class="flow-line" marker-end="url(#arrow)" />
<rect x="100" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="135" y="240">start</text>
<rect x="210" y="210" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="280" y="240">ไปที่หน้า Seller Verification</text>
<rect x="390" y="210" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="460" y="240">อัปโหลดเอกสาร / กรอกข้อมูล</text>
<rect x="570" y="430" width="150" height="60" rx="8" ry="8" class="node-system" />
<text x="645" y="452">ตรวจสอบอัตโนมัติ</text>
<text x="645" y="468">/ บันทึกข้อมูลรอรีวิว</text>
<rect x="750" y="430" width="150" height="60" rx="8" ry="8" class="node-system" />
<text x="825" y="452">เปลี่ยน Role เป็น</text>
<text x="825" y="468">Verified Seller (ถ้าผ่าน)</text>
<rect x="940" y="440" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="975" y="460">End</text>
</svg>