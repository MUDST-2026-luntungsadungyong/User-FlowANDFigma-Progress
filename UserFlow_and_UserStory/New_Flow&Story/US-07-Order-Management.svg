<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 640" width="1460" height="640">
<defs>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap');
            text {
                font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
                font-size: 13px;
                fill: #1e293b;
                text-anchor: middle;
                dominant-baseline: central;
            }
            .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: start; }
            .legend-text { font-size: 13px; fill: #475569; text-anchor: start; }
            .lane-label { font-size: 15px; font-weight: 600; fill: #64748b; }
            .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
            
            .node-start-end { fill: #86efac; stroke: #22c55e; stroke-width: 1.5; }
            .node-customer { fill: #d8b4fe; stroke: #a855f7; stroke-width: 1.5; }
            .node-seller { fill: #fef08a; stroke: #eab308; stroke-width: 1.5; }
            .node-system { fill: #fed7aa; stroke: #f97316; stroke-width: 1.5; }
            .node-error { fill: #fca5a5; stroke: #ef4444; stroke-width: 1.5; }
            .node-decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
            
            .lane-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
            .flow-line { stroke: #64748b; stroke-width: 1.8; fill: none; }
        </style>
    

        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
        <marker id="circle-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
            <circle cx="5" cy="5" r="4" fill="#64748b" />
        </marker>
    
</defs>
<rect width="1460" height="640" fill="#ffffff" />
<text x="40" y="45" class="title">US-07: Order Management System (Fulfilled &amp; Cancelled Without Shipping)</text>
<circle cx="40" cy="85" r="9" fill="#fef08a" />
<text x="58" y="85" class="legend-text">Seller actions</text>
<circle cx="180" cy="85" r="9" fill="#1e293b" />
<text x="198" y="85" class="legend-text">Decisions</text>
<circle cx="290" cy="85" r="9" fill="#fed7aa" />
<text x="308" y="85" class="legend-text">System actions</text>
<circle cx="430" cy="85" r="9" fill="#fca5a5" />
<text x="448" y="85" class="legend-text">Error</text>
<text x="45" y="245" class="lane-label" transform="rotate(-90 45 245)">Seller</text>
<line x1="80" y1="360" x2="1420" y2="360" class="lane-line" />
<text x="45" y="490" class="lane-label" transform="rotate(-90 45 490)">System</text>
<polyline points="170,240 210,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="350,240 390,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="530,240 570,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="640,200 640,177 750,177" class="flow-line" marker-end="url(#arrow)" />
<rect x="638" y="150" width="84" height="20" fill="#ffffff" rx="4" />
<text x="680" y="160" class="edge-label">Fulfilled</text>
<polyline points="640,280 640,287 750,287" class="flow-line" marker-end="url(#arrow)" />
<rect x="638" y="260" width="84" height="20" fill="#ffffff" rx="4" />
<text x="680" y="270" class="edge-label">Cancelled</text>
<polyline points="900,177 1025,177 1025,410" class="flow-line" marker-end="url(#arrow)" />
<polyline points="900,287 1025,287 1025,510" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1110,442 1135,442 1135,495 1160,495" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1110,542 1135,542 1135,495 1160,495" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1300,495 1340,495" class="flow-line" marker-end="url(#arrow)" />
<rect x="100" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="135" y="240">start</text>
<rect x="210" y="210" width="140" height="60" rx="8" ry="8" class="node-seller" />
<text x="280" y="232">เปิดหน้ารายการ</text>
<text x="280" y="248">&quot;My Incoming Orders&quot;</text>
<rect x="390" y="210" width="140" height="60" rx="8" ry="8" class="node-seller" />
<text x="460" y="232">เลือก Order ที่สถานะ</text>
<text x="460" y="248">เป็น &quot;Pending&quot;</text>
<polygon points="640,200 710,240 640,280 570,240" class="node-decision" />
<text x="640" y="240">เปลี่ยนสถานะ?</text>
<rect x="750" y="150" width="150" height="55" rx="8" ry="8" class="node-seller" />
<text x="825" y="169">กดปุ่ม &quot;Fulfilled&quot;</text>
<text x="825" y="185">(ซื้อขายสำเร็จ)</text>
<rect x="940" y="410" width="170" height="65" rx="8" ry="8" class="node-system" />
<text x="1025" y="426">ตัดสต๊อกจริง (OnHand - n)</text>
<text x="1025" y="442">ลบ Reserved และปรับ</text>
<text x="1025" y="458">สถานะเป็น Fulfilled</text>
<rect x="750" y="260" width="150" height="55" rx="8" ry="8" class="node-seller" />
<text x="825" y="279">กดปุ่ม &quot;Cancelled&quot;</text>
<text x="825" y="295">(ยกเลิกคำสั่งซื้อ)</text>
<rect x="940" y="510" width="170" height="65" rx="8" ry="8" class="node-system" />
<text x="1025" y="526">คืนสต๊อกคงเหลือ</text>
<text x="1025" y="542">(ลด Reserved)</text>
<text x="1025" y="558">ปรับสถานะ Cancelled</text>
<rect x="1160" y="465" width="140" height="60" rx="8" ry="8" class="node-system" />
<text x="1230" y="487">อัปเดตหน้าแสดงผล</text>
<text x="1230" y="503">Order สำเร็จ</text>
<rect x="1340" y="475" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="1375" y="495">End</text>
</svg>