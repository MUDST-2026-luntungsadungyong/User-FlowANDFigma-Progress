<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 580" width="1600" height="580">
<defs>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap');
            text {
                font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
                font-size: 13px;
                fill: #1e293b;
                text-anchor: middle;
                dominant-baseline: central;
            }
            .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: start; }
            .legend-text { font-size: 13px; fill: #475569; text-anchor: start; }
            .lane-label { font-size: 15px; font-weight: 600; fill: #64748b; }
            .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
            
            .node-start-end { fill: #86efac; stroke: #22c55e; stroke-width: 1.5; }
            .node-customer { fill: #d8b4fe; stroke: #a855f7; stroke-width: 1.5; }
            .node-seller { fill: #fef08a; stroke: #eab308; stroke-width: 1.5; }
            .node-system { fill: #fed7aa; stroke: #f97316; stroke-width: 1.5; }
            .node-error { fill: #fca5a5; stroke: #ef4444; stroke-width: 1.5; }
            .node-decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
            
            .lane-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
            .flow-line { stroke: #64748b; stroke-width: 1.8; fill: none; }
        </style>
    

        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
    
</defs>
<rect width="1600" height="580" fill="#ffffff" />
<text x="40" y="45" class="title">US-01-1: Customer Register &amp; Login</text>
<circle cx="40" cy="85" r="9" fill="#d8b4fe" />
<text x="58" y="85" class="legend-text">Customer actions</text>
<circle cx="200" cy="85" r="9" fill="#1e293b" />
<text x="218" y="85" class="legend-text">Decisions</text>
<circle cx="310" cy="85" r="9" fill="#fed7aa" />
<text x="328" y="85" class="legend-text">System actions</text>
<circle cx="450" cy="85" r="9" fill="#fca5a5" />
<text x="468" y="85" class="legend-text">Error</text>
<text x="45" y="255" class="lane-label" transform="rotate(-90 45 255)">Customer</text>
<line x1="80" y1="380" x2="1560" y2="380" class="lane-line" />
<text x="45" y="470" class="lane-label" transform="rotate(-90 45 470)">System</text>
<polyline points="170,240 210,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="350,240 390,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="460,200 460,180 570,180" class="flow-line" marker-end="url(#arrow)" />
<rect x="497" y="155" width="36" height="20" fill="#ffffff" rx="4" />
<text x="515" y="165" class="edge-label">Yes</text>
<polyline points="460,280 460,310 570,310" class="flow-line" marker-end="url(#arrow)" />
<rect x="501" y="285" width="28" height="20" fill="#ffffff" rx="4" />
<text x="515" y="295" class="edge-label">No</text>
<polyline points="710,180 750,180" class="flow-line" marker-end="url(#arrow)" />
<polyline points="890,180 1050,180 1050,460 1110,460" class="flow-line" marker-end="url(#arrow)" />
<polyline points="710,310 750,310" class="flow-line" marker-end="url(#arrow)" />
<polyline points="890,310 930,310" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1000,270 1000,205 1070,205" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1000,350 1000,460 930,460" class="flow-line" marker-end="url(#arrow)" />
<rect x="997" y="370" width="36" height="20" fill="#ffffff" rx="4" />
<text x="1015" y="380" class="edge-label">Yes</text>
<polyline points="1180,420 1180,335 1250,335" class="flow-line" marker-end="url(#arrow)" />
<rect x="1181" y="370" width="28" height="20" fill="#ffffff" rx="4" />
<text x="1195" y="380" class="edge-label">No</text>
<polyline points="1250,460 1300,460" class="flow-line" marker-end="url(#arrow)" />
<rect x="1257" y="435" width="36" height="20" fill="#ffffff" rx="4" />
<text x="1275" y="445" class="edge-label">Yes</text>
<polyline points="1440,460 1480,460" class="flow-line" marker-end="url(#arrow)" />
<rect x="100" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="135" y="240">start</text>
<rect x="210" y="210" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="280" y="240">เข้าสู่หน้าเว็บไซต์</text>
<polygon points="460,200 530,240 460,280 390,240" class="node-decision" />
<text x="460" y="240">มีบัญชีอยู่แล้ว?</text>
<rect x="570" y="150" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="640" y="180">เข้าหน้า Login</text>
<rect x="750" y="150" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="820" y="180">กรอกข้อมูล Login</text>
<rect x="570" y="280" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="640" y="310">เข้าหน้า Register</text>
<rect x="750" y="280" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="820" y="310">กรอกข้อมูลสมัคร</text>
<polygon points="1000,270 1070,310 1000,350 930,310" class="node-decision" />
<text x="1000" y="310">ข้อมูลครบถ้วน?</text>
<rect x="930" y="180" width="140" height="50" rx="8" ry="8" class="node-error" />
<text x="1000" y="205">แจ้งกรอกไม่ครบ</text>
<rect x="930" y="430" width="140" height="60" rx="8" ry="8" class="node-system" />
<text x="1000" y="460">สร้างบัญชีสำเร็จ</text>
<polygon points="1180,420 1250,460 1180,500 1110,460" class="node-decision" />
<text x="1180" y="452">ตรวจสอบข้อมูล</text>
<text x="1180" y="468">(Auth)</text>
<rect x="1110" y="310" width="140" height="50" rx="8" ry="8" class="node-error" />
<text x="1180" y="335">Auth Failed</text>
<rect x="1300" y="430" width="140" height="60" rx="8" ry="8" class="node-system" />
<text x="1370" y="460">เข้าสู่ระบบสำเร็จ</text>
<rect x="1480" y="440" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="1515" y="460">End</text>
</svg>