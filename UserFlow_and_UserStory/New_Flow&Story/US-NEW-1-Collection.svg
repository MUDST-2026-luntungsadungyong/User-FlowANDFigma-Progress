<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600">
<defs>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap');
            text {
                font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
                font-size: 13px;
                fill: #1e293b;
                text-anchor: middle;
                dominant-baseline: central;
            }
            .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: start; }
            .legend-text { font-size: 13px; fill: #475569; text-anchor: start; }
            .lane-label { font-size: 15px; font-weight: 600; fill: #64748b; }
            .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
            
            .node-start-end { fill: #86efac; stroke: #22c55e; stroke-width: 1.5; }
            .node-customer { fill: #d8b4fe; stroke: #a855f7; stroke-width: 1.5; }
            .node-seller { fill: #fef08a; stroke: #eab308; stroke-width: 1.5; }
            .node-system { fill: #fed7aa; stroke: #f97316; stroke-width: 1.5; }
            .node-error { fill: #fca5a5; stroke: #ef4444; stroke-width: 1.5; }
            .node-decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
            
            .lane-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
            .flow-line { stroke: #64748b; stroke-width: 1.8; fill: none; }
        </style>
    

        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
        <marker id="circle-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
            <circle cx="5" cy="5" r="4" fill="#64748b" />
        </marker>
    
</defs>
<rect width="1440" height="600" fill="#ffffff" />
<text x="40" y="45" class="title">US-NEW-1: Collection Management System (Personal Binder)</text>
<circle cx="40" cy="85" r="9" fill="#d8b4fe" />
<text x="58" y="85" class="legend-text">Customer actions</text>
<circle cx="200" cy="85" r="9" fill="#1e293b" />
<text x="218" y="85" class="legend-text">Decisions</text>
<circle cx="310" cy="85" r="9" fill="#fed7aa" />
<text x="328" y="85" class="legend-text">System actions</text>
<circle cx="450" cy="85" r="9" fill="#fca5a5" />
<text x="468" y="85" class="legend-text">Error</text>
<text x="45" y="245" class="lane-label" transform="rotate(-90 45 245)">Customer / User</text>
<line x1="80" y1="360" x2="1400" y2="360" class="lane-line" />
<text x="45" y="470" class="lane-label" transform="rotate(-90 45 470)">System</text>
<polyline points="170,240 210,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="350,240 390,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="460,200 460,177 570,177" class="flow-line" marker-end="url(#arrow)" />
<rect x="492" y="150" width="36" height="20" fill="#ffffff" rx="4" />
<text x="510" y="160" class="edge-label">Add</text>
<polyline points="720,177 750,177" class="flow-line" marker-end="url(#arrow)" />
<polyline points="900,177 1015,177 1015,410" class="flow-line" marker-end="url(#arrow)" />
<polyline points="460,280 460,287 660,287" class="flow-line" marker-end="url(#arrow)" />
<rect x="510" y="260" width="100" height="20" fill="#ffffff" rx="4" />
<text x="560" y="270" class="edge-label">Edit/Delete</text>
<polyline points="810,287 1015,287 1015,490" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1090,437 1110,437 1110,240 1130,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1090,517 1110,517 1110,240 1130,240" class="flow-line" marker-end="url(#arrow)" />
<polyline points="1280,240 1320,240" class="flow-line" marker-end="url(#arrow)" />
<rect x="100" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="135" y="240">start</text>
<rect x="210" y="210" width="140" height="60" rx="8" ry="8" class="node-customer" />
<text x="280" y="232">ผู้ใช้เข้าสู่หน้า</text>
<text x="280" y="248">&quot;My Collection&quot;</text>
<polygon points="460,200 530,240 460,280 390,240" class="node-decision" />
<text x="460" y="240">เลือกคำสั่ง</text>
<rect x="570" y="150" width="150" height="55" rx="8" ry="8" class="node-customer" />
<text x="645" y="177">ค้นหาการ์ดจาก Catalog</text>
<rect x="750" y="150" width="150" height="55" rx="8" ry="8" class="node-customer" />
<text x="825" y="177">ระบุสภาพ/ภาษา/จำนวน</text>
<rect x="940" y="410" width="150" height="55" rx="8" ry="8" class="node-system" />
<text x="1015" y="437">บันทึกลง Collection</text>
<rect x="660" y="260" width="150" height="55" rx="8" ry="8" class="node-customer" />
<text x="735" y="287">แก้ไขสภาพ/ลบการ์ด</text>
<rect x="940" y="490" width="150" height="55" rx="8" ry="8" class="node-system" />
<text x="1015" y="517">อัปเดตข้อมูล Collection</text>
<rect x="1130" y="210" width="150" height="60" rx="8" ry="8" class="node-customer" />
<text x="1205" y="232">แสดงสมุดสะสมการ์ด</text>
<text x="1205" y="248">ส่วนตัว (Private)</text>
<rect x="1320" y="220" width="70" height="40" rx="20" ry="20" class="node-start-end" />
<text x="1355" y="240">End</text>
</svg>