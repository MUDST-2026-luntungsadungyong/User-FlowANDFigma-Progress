<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1900" width="1600" height="1900" style="background:#0F172A; font-family:'Segoe UI', Tahoma, sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="40" width="1520" height="110" rx="16" fill="url(#gradHeader)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="88" fill="#F8FAFC" font-size="26" font-weight="bold">🔍 การเปรียบเทียบและแก้ไขจุดขัดแย้ง: User Flow vs Figma UI Design</text>
  <text x="70" y="122" fill="#94A3B8" font-size="16">เปรียบเทียบจุดบกพร่องของ Flow เดิม (Before) กับแนวทางแก้ไขที่สอดคล้องกับ Figma (After)</text>

  <!-- Section 1: US-04 Checkout Comparison -->
  <g transform="translate(40, 180)">
    <rect width="1520" height="380" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="30" y="40" fill="#38BDF8" font-size="20" font-weight="bold">1. จุดขัดแย้งในระบบ Checkout (US-04)</text>
    
    <!-- Before Column -->
    <rect x="30" y="60" width="700" height="290" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="45" y="75" width="150" height="30" rx="6" fill="url(#gradRed)"/>
    <text x="65" y="96" fill="#FFF" font-size="14" font-weight="bold">❌ Flow เดิมใน PDF</text>
    <text x="50" y="135" fill="#EF4444" font-size="14" font-weight="bold">• ข้ามขั้นตอนสำคัญก่อนจ่ายเงิน</text>
    
    <!-- Flow box before -->
    <rect x="60" y="160" width="160" height="50" rx="8" fill="#334155"/>
    <text x="80" y="190" fill="#FFF" font-size="13">1. ตะกร้าสินค้า</text>
    <line x1="220" y1="185" x2="270" y2="185" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="270" y="160" width="180" height="50" rx="8" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444"/>
    <text x="285" y="190" fill="#FCA5A5" font-size="13">2. ข้ามไปจ่ายเงินทันที</text>
    <line x1="450" y1="185" x2="500" y2="185" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="500" y="160" width="190" height="50" rx="8" fill="#334155"/>
    <text x="520" y="190" fill="#FFF" font-size="13">3. สร้าง QR พร้อมเพย์</text>
    
    <text x="50" y="250" fill="#94A3B8" font-size="13">⚠️ ปัญหา: ไม่มีจุดให้เลือกที่อยู่จัดส่ง และไม่มีให้เลือกรูปแบบขนส่ง</text>
    <text x="50" y="275" fill="#94A3B8" font-size="13">ทำให้ API สร้าง Order ไม่รู้ว่าจะส่งการ์ดไปให้ใครที่ไหน</text>

    <!-- After Column -->
    <rect x="760" y="60" width="730" height="290" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <rect x="775" y="75" width="180" height="30" rx="6" fill="url(#gradGreen)"/>
    <text x="790" y="96" fill="#FFF" font-size="14" font-weight="bold">✅ แก้ไขตาม Figma 100%</text>
    <text x="780" y="135" fill="#34D399" font-size="14" font-weight="bold">• Checkout แบบ 4 ขั้นตอนพร้อม Escrow Guarantee</text>

    <!-- Flow boxes after -->
    <rect x="780" y="160" width="120" height="50" rx="8" fill="#334155"/>
    <text x="795" y="190" fill="#FFF" font-size="12">1. ตะกร้าสินค้า</text>
    <line x1="900" y1="185" x2="925" y2="185" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="925" y="160" width="130" height="50" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981"/>
    <text x="935" y="190" fill="#6EE7B7" font-size="12">2. เลือกที่อยู่จัดส่ง</text>
    <line x1="1055" y1="185" x2="1080" y2="185" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="1080" y="160" width="130" height="50" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981"/>
    <text x="1090" y="190" fill="#6EE7B7" font-size="12">3. เลือกวิธีขนส่ง</text>
    <line x1="1210" y1="185" x2="1235" y2="185" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="1235" y="160" width="130" height="50" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981"/>
    <text x="1245" y="190" fill="#6EE7B7" font-size="12">4. เลือกวิธีจ่ายเงิน</text>
    <line x1="1365" y1="185" x2="1390" y2="185" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="1390" y="160" width="90" height="50" rx="8" fill="#3B82F6"/>
    <text x="1405" y="190" fill="#FFF" font-size="12">5. จ่ายเงิน</text>

    <text x="780" y="250" fill="#E2E8F0" font-size="13">✨ ประโยชน์: รองรับ Address Book (`frame_2`), เลือกระบบประกัน Hub (`frame_3`),</text>
    <text x="780" y="275" fill="#E2E8F0" font-size="13">และเงินจะถูก Hold ใน Escrow Vault ทันทีเมื่อจ่ายเสร็จ (`frame_6`)</text>
  </g>

  <!-- Section 2: US-07 2-Leg Shipping & QC Hub Comparison -->
  <g transform="translate(40, 590)">
    <rect width="1520" height="420" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="30" y="40" fill="#38BDF8" font-size="20" font-weight="bold">2. จุดขัดแย้งในระบบจัดส่งและตรวจสภาพการ์ด (US-07 vs QC Hub)</text>

    <!-- Before Column -->
    <rect x="30" y="60" width="700" height="330" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="45" y="75" width="150" height="30" rx="6" fill="url(#gradRed)"/>
    <text x="65" y="96" fill="#FFF" font-size="14" font-weight="bold">❌ Flow เดิมใน PDF</text>
    <text x="50" y="135" fill="#EF4444" font-size="14" font-weight="bold">• ส่งของจังหวะเดียว (Single-Leg Monolithic)</text>

    <rect x="60" y="160" width="180" height="50" rx="8" fill="#334155"/>
    <text x="80" y="190" fill="#FFF" font-size="13">Admin ดูออเดอร์</text>
    <line x1="240" y1="185" x2="280" y2="185" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="280" y="160" width="180" height="50" rx="8" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444"/>
    <text x="295" y="190" fill="#FCA5A5" font-size="13">กดจัดส่ง + ใส่เลข Track</text>
    <line x1="460" y1="185" x2="500" y2="185" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="500" y="160" width="180" height="50" rx="8" fill="#334155"/>
    <text x="530" y="190" fill="#FFF" font-size="13">สถานะ Fulfilled</text>

    <text x="50" y="245" fill="#94A3B8" font-size="13">⚠️ ปัญหา: ไม่มีกระบวนการตรวจของแท้/ปลอม ไม่มีการตรวจสภาพการ์ด</text>
    <text x="50" y="270" fill="#94A3B8" font-size="13">และไม่มีจุดตัดสินใจ (Decision Point) กรณีที่การ์ดปลอมหรือสภาพไม่ตรงปก</text>
    <text x="50" y="295" fill="#EF4444" font-size="13">ขัดแย้งกับ UI `platform-admin/frame_4` ที่มีหน้าต่าง QC Pass / Fail ชัดเจน</text>

    <!-- After Column -->
    <rect x="760" y="60" width="730" height="330" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <rect x="775" y="75" width="220" height="30" rx="6" fill="url(#gradGreen)"/>
    <text x="790" y="96" fill="#FFF" font-size="14" font-weight="bold">✅ แก้ไขเป็น 2-Leg + QC Hub</text>
    <text x="780" y="135" fill="#34D399" font-size="14" font-weight="bold">• แยก Seller Fulfillment (Leg 1) และ Hub QC (Leg 2)</text>

    <!-- Step 1: Leg 1 -->
    <rect x="780" y="160" width="170" height="50" rx="8" fill="#3B82F6"/>
    <text x="790" y="185" fill="#FFF" font-size="12" font-weight="bold">1. Seller ส่งเข้า Hub</text>
    <text x="790" y="200" fill="#93C5FD" font-size="11">พิมพ์ใบปะหน้า Leg 1</text>
    <line x1="950" y1="185" x2="980" y2="185" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Step 2: QC Decision -->
    <polygon points="1050,160 1120,185 1050,210 980,185" fill="#8B5CF6" stroke="#C4B5FD" stroke-width="1.5"/>
    <text x="1025" y="190" fill="#FFF" font-size="12" font-weight="bold">ตรวจ QC?</text>

    <!-- Pass branch -->
    <line x1="1120" y1="185" x2="1170" y2="185" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="1125" y="175" fill="#34D399" font-size="11">Pass</text>
    <rect x="1170" y="160" width="170" height="50" rx="8" fill="#10B981"/>
    <text x="1180" y="185" fill="#FFF" font-size="12" font-weight="bold">2. Hub ส่งหา Buyer</text>
    <text x="1180" y="200" fill="#D1FAE5" font-size="11">Leg 2 ➔ Buyer รับ ➔ จ่ายเงิน</text>

    <!-- Fail branch -->
    <path d="M 1050 210 L 1050 260 L 1170 260" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="1060" y="240" fill="#F87171" font-size="11">Fail</text>
    <rect x="1170" y="235" width="170" height="50" rx="8" fill="#EF4444"/>
    <text x="1180" y="260" fill="#FFF" font-size="12" font-weight="bold">3. ระงับ Escrow</text>
    <text x="1180" y="275" fill="#FEE2E2" font-size="11">คืนเงิน Buyer / ส่งการ์ดคืน Seller</text>

    <text x="780" y="325" fill="#E2E8F0" font-size="13">✨ ตรงกับ Figma 100%: `seller/frame_6` (Leg 1 Label) และ `platform-admin/frame_4` (QC Modal)</text>
    <text x="780" y="350" fill="#E2E8F0" font-size="13">ทำให้ระบบมีกลไกป้องกันการ์ดปลอมและการ์ดมีตำหนิตรงตามข้อตกลง</text>
  </g>

  <!-- Section 3: Summary of Other 4 Conflicts -->
  <g transform="translate(40, 1040)">
    <rect width="1520" height="780" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="30" y="40" fill="#38BDF8" font-size="20" font-weight="bold">3. สรุปจุดขัดแย้งอื่นๆ และแนวทางแก้ไข (Conflicts 3–6)</text>

    <!-- Item 3: Auth -->
    <rect x="30" y="60" width="1460" height="150" rx="8" fill="#0F172A" stroke="#334155"/>
    <rect x="45" y="75" width="180" height="26" rx="4" fill="url(#gradBlue)"/>
    <text x="55" y="93" fill="#FFF" font-size="13" font-weight="bold">US-01: สมัครสมาชิก &amp; กู้รหัสผ่าน</text>
    <text x="240" y="93" fill="#F87171" font-size="13">• ขัดแย้ง: Flow ระบุให้กรอกแค่ Username/Password แต่ Figma `auth/frame_2` มีช่อง Email</text>
    <text x="50" y="130" fill="#34D399" font-size="13">✅ แก้ไข: เพิ่มฟิลด์ `Email` ในฟอร์มสมัครสมาชิก + เพิ่ม Sub-flow "Forgot Password &amp; Set New Password" ตาม Figma `auth/frame_3` ถึง `frame_6`</text>
    <text x="50" y="155" fill="#94A3B8" font-size="12">ผลลัพธ์: ลูกค้าสามารถยืนยันตัวตนทางอีเมล และสามารถขอรีเซ็ตรหัสผ่านได้เมื่อลืม</text>

    <!-- Item 4: Seller Listing -->
    <rect x="30" y="230" width="1460" height="150" rx="8" fill="#0F172A" stroke="#334155"/>
    <rect x="45" y="245" width="200" height="26" rx="4" fill="url(#gradPurple)"/>
    <text x="55" y="263" fill="#FFF" font-size="13" font-weight="bold">US-05-1: การลงขายการ์ด (Inventory)</text>
    <text x="260" y="263" fill="#F87171" font-size="13">• ขัดแย้ง: Flow ให้พิมพ์ชื่อการ์ดเองอิสระ แต่ Figma `seller/frame_3` ค้นหาจาก Master Database</text>
    <text x="50" y="300" fill="#34D399" font-size="13">✅ แก้ไข: ปรับ Flow ให้ค้นหาชื่อการ์ดจาก Master Catalog ➔ เลือกระดับสภาพ (Mint, Near Mint, LP) ➔ อัปโหลดภาพถ่ายสภาพจริง</text>
    <text x="50" y="325" fill="#94A3B8" font-size="12">ผลลัพธ์: ป้องกันชื่อการ์ดสะกดผิด และทำให้หน้ารายละเอียดการ์ดสามารถรวมหลายๆ ร้านค้าที่ขายใบเดียวกันได้</text>

    <!-- Item 5: Multi-Seller Marketplace -->
    <rect x="30" y="400" width="1460" height="150" rx="8" fill="#0F172A" stroke="#334155"/>
    <rect x="45" y="415" width="230" height="26" rx="4" fill="url(#gradBlue)"/>
    <text x="55" y="433" fill="#FFF" font-size="13" font-weight="bold">US-02 / US-03: Multi-Seller Marketplace</text>
    <text x="295" y="433" fill="#F87171" font-size="13">• ขัดแย้ง: Flow มองว่าการ์ด 1 ใบมีสต็อกรวมก้อนเดียว แต่ Figma `Shop &amp; Browse/frame_3` มีหลายร้านลงขาย</text>
    <text x="50" y="470" fill="#34D399" font-size="13">✅ แก้ไข: ปรับระบบตะกร้าให้บันทึกคู่กับ `seller_id` และเมื่อกดเพิ่มสินค้า ให้เปิด Cart Drawer (`frame_6`) แสดงการ์ดที่เลือก</text>
    <text x="50" y="495" fill="#94A3B8" font-size="12">ผลลัพธ์: ลูกค้าสามารถเลือกซื้อจากร้านที่ให้ราคาดีที่สุดหรือสภาพตรงใจที่สุดได้อย่างถูกต้อง</text>

    <!-- Item 6: Missing Features in Flow -->
    <rect x="30" y="570" width="1460" height="180" rx="8" fill="#0F172A" stroke="#334155"/>
    <rect x="45" y="585" width="220" height="26" rx="4" fill="url(#gradRed)"/>
    <text x="55" y="603" fill="#FFF" font-size="13" font-weight="bold">Missing Flows: ฟีเจอร์ที่ตกหล่น</text>
    <text x="280" y="603" fill="#F87171" font-size="13">• ขัดแย้ง: มีหน้าจอสมบูรณ์ใน Figma แต่ไม่มีใน Flow Chart เลย</text>
    <text x="50" y="640" fill="#34D399" font-size="13">✅ เพิ่ม 3 Flow ใหม่:</text>
    <text x="70" y="665" fill="#E2E8F0" font-size="12">1. **Seller Wallet &amp; Payout Flow (`seller/frame_9-11`):** ร้านค้าตรวจสอบเงินในกระเป๋า และสั่งถอนเงิน Escrow เข้าบัญชีธนาคาร</text>
    <text x="70" y="690" fill="#E2E8F0" font-size="12">2. **Bulk CSV Upload Flow (`seller/frame_8`):** ร้านค้าอัปโหลดไฟล์ CSV เพื่อลงขายการ์ดจำนวนมากในครั้งเดียว</text>
    <text x="70" y="715" fill="#E2E8F0" font-size="12">3. **Dispute Resolution Flow (`platform-admin/frame_7`):** ลูกค้าและร้านค้ายื่นหลักฐานเมื่อการ์ดมีปัญหา ➔ Super Admin ตัดสินผล</text>
  </g>
</svg>
